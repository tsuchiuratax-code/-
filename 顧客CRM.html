<style>
  :root {
    --primary: #1e40af;
    --primary-light: #3b82f6;
    --primary-bg: #eff6ff;
    --secondary: #059669;
    --warning: #d97706;
    --danger: #dc2626;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-300: #d1d5db;
    --gray-400: #9ca3af;
    --gray-500: #6b7280;
    --gray-600: #4b5563;
    --gray-700: #374151;
    --gray-800: #1f2937;
    --gray-900: #111827;
    --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
    --radius: 8px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic UI',sans-serif; background: var(--gray-100); color: var(--gray-800); font-size:14px; }

  /* Layout */
  .app { display:flex; min-height:100vh; }
  .sidebar { width:240px; background:var(--gray-900); color:white; padding:0; flex-shrink:0; display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:100; transition: transform 0.3s; }
  .sidebar-header { padding:20px; border-bottom:1px solid var(--gray-700); }
  .sidebar-header h1 { font-size:16px; font-weight:700; color:white; }
  .sidebar-header p { font-size:11px; color:var(--gray-400); margin-top:4px; }
  .sidebar-nav { flex:1; padding:12px 0; }
  .nav-item { display:flex; align-items:center; padding:10px 20px; color:var(--gray-300); cursor:pointer; transition:all 0.15s; font-size:13px; gap:10px; border-left:3px solid transparent; }
  .nav-item:hover { background:var(--gray-800); color:white; }
  .nav-item.active { background:var(--gray-800); color:var(--primary-light); border-left-color:var(--primary-light); }
  .nav-item i { width:18px; text-align:center; font-size:14px; }
  .nav-badge { margin-left:auto; background:var(--primary-light); color:white; font-size:10px; padding:2px 7px; border-radius:10px; }

  .main { margin-left:240px; flex:1; min-height:100vh; }
  .topbar { background:white; padding:12px 28px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--gray-200); position:sticky; top:0; z-index:50; }
  .topbar-title { font-size:18px; font-weight:700; color:var(--gray-800); }
  .topbar-actions { display:flex; gap:10px; align-items:center; }

  .content { padding:24px 28px; }

  /* Cards */
  .card { background:white; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--gray-200); }
  .card-header { padding:16px 20px; border-bottom:1px solid var(--gray-200); display:flex; align-items:center; justify-content:space-between; }
  .card-header h2 { font-size:15px; font-weight:600; }
  .card-body { padding:20px; }

  /* Buttons */
  .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border:none; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; transition:all 0.15s; text-decoration:none; }
  .btn-primary { background:var(--primary); color:white; }
  .btn-primary:hover { background:var(--primary-light); }
  .btn-secondary { background:var(--gray-100); color:var(--gray-700); border:1px solid var(--gray-300); }
  .btn-secondary:hover { background:var(--gray-200); }
  .btn-success { background:var(--secondary); color:white; }
  .btn-success:hover { opacity:0.9; }
  .btn-danger { background:var(--danger); color:white; }
  .btn-danger:hover { opacity:0.9; }
  .btn-sm { padding:5px 10px; font-size:12px; }
  .btn-icon { padding:6px 8px; }

  /* Form */
  .form-group { margin-bottom:16px; }
  .form-label { display:block; font-size:12px; font-weight:600; color:var(--gray-600); margin-bottom:5px; }
  .form-input { width:100%; padding:8px 12px; border:1px solid var(--gray-300); border-radius:6px; font-size:13px; color:var(--gray-800); transition:border 0.15s; outline:none; font-family:inherit; }
  .form-input:focus { border-color:var(--primary-light); box-shadow:0 0 0 3px rgba(59,130,246,0.1); }
  select.form-input { appearance:auto; }
  textarea.form-input { resize:vertical; min-height:80px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .form-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }

  /* Table */
  .table-wrapper { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; padding:10px 14px; font-size:11px; font-weight:600; color:var(--gray-500); text-transform:uppercase; letter-spacing:0.5px; background:var(--gray-50); border-bottom:1px solid var(--gray-200); }
  td { padding:10px 14px; border-bottom:1px solid var(--gray-100); font-size:13px; }
  tr:hover td { background:var(--primary-bg); }
  tr { cursor:pointer; }

  /* Badge */
  .badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; }
  .badge-blue { background:#dbeafe; color:#1d4ed8; }
  .badge-green { background:#d1fae5; color:#065f46; }
  .badge-yellow { background:#fef3c7; color:#92400e; }
  .badge-red { background:#fee2e2; color:#991b1b; }
  .badge-gray { background:var(--gray-100); color:var(--gray-600); }
  .badge-purple { background:#ede9fe; color:#5b21b6; }

  /* Stats */
  .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
  .stat-card { background:white; border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); border:1px solid var(--gray-200); }
  .stat-card .stat-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; margin-bottom:12px; }
  .stat-card .stat-value { font-size:28px; font-weight:700; color:var(--gray-900); }
  .stat-card .stat-label { font-size:12px; color:var(--gray-500); margin-top:2px; }

  /* Modal */
  .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px; }
  .modal { background:white; border-radius:12px; width:100%; max-width:700px; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-lg); }
  .modal-header { padding:20px 24px; border-bottom:1px solid var(--gray-200); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:white; border-radius:12px 12px 0 0; z-index:1; }
  .modal-header h2 { font-size:17px; font-weight:700; }
  .modal-body { padding:24px; }
  .modal-footer { padding:16px 24px; border-top:1px solid var(--gray-200); display:flex; justify-content:flex-end; gap:8px; }

  /* Tabs */
  .tabs { display:flex; border-bottom:2px solid var(--gray-200); margin-bottom:20px; gap:0; }
  .tab { padding:10px 20px; font-size:13px; font-weight:500; color:var(--gray-500); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all 0.15s; }
  .tab:hover { color:var(--gray-700); }
  .tab.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }

  /* Search */
  .search-bar { display:flex; gap:10px; margin-bottom:16px; align-items:center; flex-wrap:wrap; }
  .search-input-wrapper { position:relative; flex:1; min-width:200px; }
  .search-input-wrapper i { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--gray-400); }
  .search-input-wrapper input { padding-left:36px; }

  /* Timeline */
  .timeline { position:relative; padding-left:24px; }
  .timeline::before { content:''; position:absolute; left:8px; top:4px; bottom:4px; width:2px; background:var(--gray-200); }
  .timeline-item { position:relative; margin-bottom:20px; }
  .timeline-item::before { content:''; position:absolute; left:-20px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--primary-light); border:2px solid white; box-shadow:var(--shadow); }
  .timeline-date { font-size:11px; color:var(--gray-400); margin-bottom:4px; }
  .timeline-content { background:var(--gray-50); padding:12px 16px; border-radius:8px; border:1px solid var(--gray-200); }
  .timeline-content h4 { font-size:13px; font-weight:600; margin-bottom:4px; }
  .timeline-content p { font-size:12px; color:var(--gray-600); line-height:1.6; }

  /* Misc */
  .text-muted { color:var(--gray-500); font-size:12px; }
  .empty-state { text-align:center; padding:48px 20px; color:var(--gray-400); }
  .empty-state i { font-size:48px; margin-bottom:12px; }
  .empty-state p { font-size:14px; }
  .tag { display:inline-block; padding:2px 8px; background:var(--gray-100); border-radius:4px; font-size:11px; color:var(--gray-600); margin:2px; }
  .detail-row { display:flex; padding:10px 0; border-bottom:1px solid var(--gray-100); }
  .detail-label { width:140px; font-size:12px; color:var(--gray-500); font-weight:500; flex-shrink:0; }
  .detail-value { font-size:13px; color:var(--gray-800); }
  .toast { position:fixed; bottom:24px; right:24px; background:var(--gray-800); color:white; padding:12px 20px; border-radius:8px; font-size:13px; box-shadow:var(--shadow-lg); z-index:300; animation: slideIn 0.3s ease; display:flex; align-items:center; gap:8px; }
  @keyframes slideIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

  .chart-bar-container { display:flex; align-items:flex-end; gap:8px; height:160px; padding-top:20px; }
  .chart-bar-wrapper { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .chart-bar { width:100%; border-radius:4px 4px 0 0; transition: height 0.5s; min-height:2px; }
  .chart-bar-label { font-size:10px; color:var(--gray-500); }
  .chart-bar-value { font-size:11px; font-weight:600; color:var(--gray-700); }

  /* Print */
  @media print {
    .sidebar, .topbar { display:none !important; }
    .main { margin-left:0 !important; }
  }
  /* Responsive */
  @media (max-width:1024px) {
    .stats-grid { grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:768px) {
    .sidebar { transform:translateX(-100%); }
    .sidebar.open { transform:translateX(0); }
    .main { margin-left:0; }
    .stats-grid { grid-template-columns:1fr; }
    .form-row, .form-row-3 { grid-template-columns:1fr; }
  }
</style>

  try {

      localStorage.setItem('crm_version', DATA_VERSION);

  }
  catch(e) { return fallback; }
};

const sampleHistories = [];

// ===== Main App =====
function App() {
  const [page, setPage] = useState('dashboard');
  const [clients, setClients] = useState(() => loadData('clients', sampleClients));
  const [contracts, setContracts] = useState(() => loadData('contracts', sampleContracts));
  const [histories, setHistories] = useState(() => loadData('histories', sampleHistories));
  const [selectedClientId, setSelectedClientId] = useState(null);
  const [modal, setModal] = useState(null);
  const [toast, setToast] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);

  useEffect(() => { saveData('clients', clients); }, [clients]);
  useEffect(() => { saveData('contracts', contracts); }, [contracts]);
  useEffect(() => { saveData('histories', histories); }, [histories]);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2500);
  }, []);

  const openClientDetail = (id) => { setSelectedClientId(id); setPage('detail'); };
  const goBack = () => { setSelectedClientId(null); setPage('clients'); };

  // CRUD
  const addClient = (data) => { const c = {...data, id:generateId(), createdAt:today()}; setClients(p=>[...p,c]); showToast('顧客を登録しました'); };
  const updateClient = (data) => { setClients(p=>p.map(c=>c.id===data.id?{...c,...data}:c)); showToast('顧客情報を更新しました'); };
  const deleteClient = (id) => { setClients(p=>p.filter(c=>c.id!==id)); setContracts(p=>p.filter(c=>c.clientId!==id)); setHistories(p=>p.filter(h=>h.clientId!==id)); goBack(); showToast('顧客を削除しました'); };
  const addContract = (data) => { const c = {...data, id:generateId()}; setContracts(p=>[...p,c]); showToast('契約を追加しました'); };
  const updateContract = (data) => { setContracts(p=>p.map(c=>c.id===data.id?{...c,...data}:c)); showToast('契約を更新しました'); };
  const deleteContract = (id) => { setContracts(p=>p.filter(c=>c.id!==id)); showToast('契約を削除しました'); };
  const addHistory = (data) => { const h = {...data, id:generateId()}; setHistories(p=>[...p,h]); showToast('対応履歴を追加しました'); };
  const deleteHistory = (id) => { setHistories(p=>p.filter(h=>h.id!==id)); showToast('対応履歴を削除しました'); };

  // CSV Export
  const exportCSV = () => {
    const headers = ['会社名','代表者','担当者','電話','メール','郵便番号','住所','法人/個人','業種','資本金','従業員数','決算月','ステータス','サービス','月額顧問料','管轄税務署','法人番号','メモ','登録日'];
    const rows = clients.map(c => [c.companyName,c.representative,c.contactPerson,c.phone,c.email,c.postalCode,c.address,c.companyType,c.industry,c.capitalAmount,c.employeeCount,c.fiscalMonth,c.status,(c.services||[]).join('/'),c.monthlyFee,c.taxOffice,c.corporateNumber,c.notes,c.createdAt]);
    const bom = '\uFEFF';
    const csv = bom + [headers,...rows].map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `顧客一覧_${today()}.csv`; a.click();
    URL.revokeObjectURL(url);
    showToast('CSVをエクスポートしました');
  };

  // CSV Import
  const importCSV = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const text = ev.target.result;
      const lines = text.split('\n').filter(l => l.trim());
      if (lines.length < 2) { showToast('データがありません'); return; }
      const newClients = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].match(/(".*?"|[^,]*)/g) || [];
        const clean = cols.map(c => c.replace(/^"|"$/g, '').replace(/""/g, '"').trim());
        if (clean[0]) {
          newClients.push({
            id: generateId(), companyName: clean[0]||'', representative: clean[1]||'', contactPerson: clean[2]||'',
            phone: clean[3]||'', email: clean[4]||'', postalCode: clean[5]||'', address: clean[6]||'',
            companyType: clean[7]||'法人', industry: clean[8]||'', capitalAmount: Number(clean[9])||0,
            employeeCount: Number(clean[10])||0, fiscalMonth: Number(clean[11])||3, status: clean[12]||'契約中',
            services: (clean[13]||'').split('/').filter(Boolean), monthlyFee: Number(clean[14])||0,
            taxOffice: clean[15]||'', corporateNumber: clean[16]||'', notes: clean[17]||'', createdAt: clean[18]||today()
          });
        }
      }
      setClients(p => [...p, ...newClients]);
      showToast(`${newClients.length}件の顧客をインポートしました`);
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const activeClients = clients.filter(c => c.status === '契約中');
  const totalMonthlyRevenue = activeClients.reduce((sum, c) => {
    const clientContracts = contracts.filter(ct => ct.clientId === c.id && ct.status === '継続中');
    return sum + clientContracts.reduce((s, ct) => s + (Number(ct.monthlyFee) || 0), 0);
  }, 0);
  const totalAnnualFee = contracts.filter(c => c.status === '継続中').reduce((s, c) => s + (Number(c.annualFee) || 0), 0);
  const upcomingFiscalClients = activeClients.filter(c => {
    const now = new Date();
    const fm = c.fiscalMonth;
    const diff = (fm - now.getMonth()) % 12;
    return diff >= 0 && diff <= 2;
  });

  return (
    <div className="app">
      <aside className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
        <div className="sidebar-header">
          <h1><i className="fas fa-building" style={{marginRight:8}}></i>顧客管理CRM</h1>
          <p>士業事務所向け</p>
        </div>
        <nav className="sidebar-nav">
          <div className={`nav-item ${page==='dashboard'?'active':''}`} onClick={()=>{setPage('dashboard');setSidebarOpen(false);}}>
            <i className="fas fa-chart-line"></i>ダッシュボード
          </div>
          <div className={`nav-item ${page==='clients'||page==='detail'?'active':''}`} onClick={()=>{setPage('clients');setSelectedClientId(null);setSidebarOpen(false);}}>
            <i className="fas fa-users"></i>顧客一覧
            <span className="nav-badge">{clients.length}</span>
          </div>
          <div className={`nav-item ${page==='calendar'?'active':''}`} onClick={()=>{setPage('calendar');setSidebarOpen(false);}}>
            <i className="fas fa-calendar-alt"></i>決算カレンダー
          </div>
          <div className={`nav-item ${page==='reports'?'active':''}`} onClick={()=>{setPage('reports');setSidebarOpen(false);}}>
            <i className="fas fa-file-alt"></i>レポート
          </div>
        </nav>
        <div style={{padding:'16px 20px',borderTop:'1px solid #374151'}}>
          <div className="nav-item" onClick={exportCSV} style={{padding:'8px 0'}}>
            <i className="fas fa-download"></i>CSVエクスポート
          </div>
          <label className="nav-item" style={{padding:'8px 0',cursor:'pointer'}}>
            <i className="fas fa-upload"></i>CSVインポート
            <input type="file" accept=".csv" onChange={importCSV} style={{display:'none'}} />
          </label>
        </div>
      </aside>

      <main className="main">
        <div className="topbar">
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <button className="btn btn-icon" onClick={()=>setSidebarOpen(!sidebarOpen)} style={{display:'none'}} id="menuBtn">
              <i className="fas fa-bars"></i>
            </button>
            <span className="topbar-title">
              {page==='dashboard'&&'ダッシュボード'}
              {page==='clients'&&'顧客一覧'}
              {page==='detail'&&'顧客詳細'}
              {page==='calendar'&&'決算カレンダー'}
              {page==='reports'&&'レポート'}
            </span>
          </div>
          <div className="topbar-actions">
            <span className="text-muted">{today()}</span>
            {(page==='clients'||page==='dashboard') && (
              <button className="btn btn-primary" onClick={()=>setModal({type:'addClient'})}>
                <i className="fas fa-plus"></i>新規顧客登録
              </button>
            )}
          </div>
        </div>

        <div className="content">
          {page==='dashboard' && <Dashboard clients={clients} contracts={contracts} histories={histories} activeClients={activeClients} totalMonthlyRevenue={totalMonthlyRevenue} totalAnnualFee={totalAnnualFee} upcomingFiscalClients={upcomingFiscalClients} openClientDetail={openClientDetail} />}
          {page==='clients' && <ClientList clients={clients} contracts={contracts} openClientDetail={openClientDetail} setModal={setModal} />}
          {page==='detail' && selectedClientId && <ClientDetail client={clients.find(c=>c.id===selectedClientId)} contracts={contracts.filter(c=>c.clientId===selectedClientId)} histories={histories.filter(h=>h.clientId===selectedClientId)} goBack={goBack} setModal={setModal} updateClient={updateClient} deleteClient={deleteClient} addContract={addContract} updateContract={updateContract} deleteContract={deleteContract} addHistory={addHistory} deleteHistory={deleteHistory} clientId={selectedClientId} />}
          {page==='calendar' && <FiscalCalendar clients={activeClients} openClientDetail={openClientDetail} />}
          {page==='reports' && <Reports clients={clients} contracts={contracts} histories={histories} />}
        </div>
      </main>

      {modal && <ModalRouter modal={modal} setModal={setModal} addClient={addClient} updateClient={updateClient} addContract={addContract} updateContract={updateContract} addHistory={addHistory} />}
      {toast && <div className="toast"><i className="fas fa-check-circle"></i>{toast}</div>}
    </div>
  );
}

// ===== Dashboard =====

          <div className="stat-value">{upcomingFiscalClients.length}</div>
          <div className="stat-label">直近の決算予定</div>
        </div>
        <div className="stat-card">
          <div className="stat-icon" style={{background:'#ede9fe',color:'#5b21b6'}}><i className="fas fa-user-plus"></i></div>
          <div className="stat-value">{prospectClients.length}</div>

            <table>

                  return (
                    <tr key={h.id} onClick={()=>openClientDetail(h.clientId)}>
                      <td>{formatDate(h.date)}</td>

// ===== Client List =====
function ClientList({clients,contracts,openClientDetail,setModal}) {
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [typeFilter, setTypeFilter] = useState('all');
  const [sortKey, setSortKey] = useState('companyName');
  const [sortDir, setSortDir] = useState('asc');

  const filtered = useMemo(() => {
    let list = [...clients];
    if (search) {
      const s = search.toLowerCase();
      list = list.filter(c =>
        (c.companyName||'').toLowerCase().includes(s) ||
        (c.representative||'').toLowerCase().includes(s) ||
        (c.contactPerson||'').toLowerCase().includes(s) ||
        (c.phone||'').includes(s) ||
        (c.email||'').toLowerCase().includes(s) ||
        (c.address||'').toLowerCase().includes(s) ||
        (c.industry||'').toLowerCase().includes(s)
      );
    }
    if (statusFilter !== 'all') list = list.filter(c=>c.status===statusFilter);
    if (typeFilter !== 'all') list = list.filter(c=>c.companyType===typeFilter);
    list.sort((a,b) => {
      let va = a[sortKey]||'', vb = b[sortKey]||'';
      if (typeof va === 'number') return sortDir==='asc' ? va-vb : vb-va;
      return sortDir==='asc' ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
    });
    return list;
  }, [clients, search, statusFilter, typeFilter, sortKey, sortDir]);

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir(d=>d==='asc'?'desc':'asc');
    else { setSortKey(key); setSortDir('asc'); }
  };
  const SortIcon = ({k}) => sortKey===k ? <i className={`fas fa-sort-${sortDir==='asc'?'up':'down'}`} style={{marginLeft:4,fontSize:10}}></i> : null;

  const statusBadge = (s) => {
    const map = {'契約中':'badge-green','休止中':'badge-yellow','見込み':'badge-blue','解約済':'badge-red'};
    return <span className={`badge ${map[s]||'badge-gray'}`}>{s}</span>;
  };

  return (
    <div>
      <div className="search-bar">
        <div className="search-input-wrapper">
          <i className="fas fa-search"></i>
          <input className="form-input" placeholder="会社名・担当者名・電話番号などで検索..." value={search} onChange={e=>setSearch(e.target.value)} />
        </div>
        <select className="form-input" style={{width:140}} value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
          <option value="all">すべてのステータス</option>
          {CLIENT_STATUS.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <select className="form-input" style={{width:120}} value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
          <option value="all">法人/個人</option>
          <option value="法人">法人</option>
          <option value="個人">個人</option>
        </select>
        <span className="text-muted">{filtered.length}件</span>
      </div>

      <div className="card">
        <div className="table-wrapper">
          <table>
            <thead>
              <tr>
                <th style={{cursor:'pointer'}} onClick={()=>toggleSort('companyName')}>会社名<SortIcon k="companyName"/></th>
                <th>担当者</th>
                <th>電話</th>
                <th style={{cursor:'pointer'}} onClick={()=>toggleSort('fiscalMonth')}>決算月<SortIcon k="fiscalMonth"/></th>
                <th>ステータス</th>
                <th>サービス</th>
                <th style={{cursor:'pointer',textAlign:'right'}} onClick={()=>toggleSort('monthlyFee')}>月額<SortIcon k="monthlyFee"/></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(c => {
                const clientContracts = contracts.filter(ct=>ct.clientId===c.id&&ct.status==='継続中');
                const monthlyTotal = clientContracts.reduce((s,ct)=>s+(Number(ct.monthlyFee)||0),0);
                return (
                  <tr key={c.id} onClick={()=>openClientDetail(c.id)}>
                    <td>
                      <div style={{fontWeight:600}}>{c.companyName}</div>
                      <div className="text-muted">{c.companyType} / {c.industry||'—'}</div>
                    </td>
                    <td>{c.contactPerson||c.representative}</td>
                    <td>{c.phone}</td>
                    <td>{c.fiscalMonth}月</td>
                    <td>{statusBadge(c.status)}</td>
                    <td>{(c.services||[]).slice(0,2).map(s=><span key={s} className="tag">{s}</span>)}{(c.services||[]).length>2&&<span className="tag">+{c.services.length-2}</span>}</td>
                    <td style={{textAlign:'right',fontWeight:500}}>{monthlyTotal>0?formatCurrency(monthlyTotal):'—'}</td>
                  </tr>
                );
              })}
              {filtered.length===0 && (
                <tr><td colSpan={7} style={{textAlign:'center',padding:40,color:'var(--gray-400)'}}>該当する顧客がありません</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

              {sortedHistories.map(h => (
                <div key={h.id} className="timeline-item">
                  <div className="timeline-date">{formatDate(h.date)} / {h.method} / 担当：{h.staff||'—'}</div>
                  <div className="timeline-content">
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                      <h4>{h.subject}</h4>
                      <button className="btn btn-danger btn-sm" style={{flexShrink:0}} onClick={()=>{if(confirm('この履歴を削除しますか？'))deleteHistory(h.id)}}><i className="fas fa-trash"></i></button>
                    </div>
                    <p>{h.content}</p>
                    {h.nextAction && <p style={{marginTop:8,color:'var(--primary)',fontWeight:500}}>▶ 次回アクション：{h.nextAction}</p>}
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <div className="card"><div className="empty-state"><i className="fas fa-history"></i><p>対応履歴がまだありません</p></div></div>
          )}
        </div>
      )}
    </div>
  );
}

// ===== Fiscal Calendar =====
function FiscalCalendar({clients,openClientDetail}) {
  const months = FISCAL_MONTHS.map(m => {
    const cls = clients.filter(c => c.fiscalMonth === m);
    return { month:m, clients:cls };
  });
  const now = new Date();
  const currentMonth = now.getMonth() + 1;

  return (
    <div>
      <p className="text-muted" style={{marginBottom:16}}>各月の決算法人数と、今後の申告スケジュールを確認できます。決算月の2ヶ月後が法人税等の申告期限です。</p>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
        {months.map(({month,clients:cls}) => {
          const isNear = ((month - currentMonth + 12) % 12) <= 2 && ((month - currentMonth + 12) % 12) >= 0;
          return (
            <div key={month} className="card" style={{border:isNear?'2px solid var(--warning)':''}}>
              <div className="card-header" style={{background:isNear?'#fef3c7':''}}>
                <h2>{month}月決算</h2>
                <span className={`badge ${cls.length>0?'badge-blue':'badge-gray'}`}>{cls.length}件</span>
              </div>
              <div className="card-body" style={{padding:12}}>
                {cls.length > 0 ? cls.map(c => (
                  <div key={c.id} style={{padding:'6px 0',borderBottom:'1px solid var(--gray-100)',cursor:'pointer',fontSize:12}} onClick={()=>openClientDetail(c.id)}>
                    <div style={{fontWeight:600}}>{c.companyName}</div>
                    <div className="text-muted">申告期限：{month+2>12?month+2-12:month+2}月末</div>
                  </div>
                )) : <div className="text-muted" style={{textAlign:'center',padding:8}}>なし</div>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ===== Reports =====
function Reports({clients,contracts,histories}) {
  const activeClients = clients.filter(c=>c.status==='契約中');
  const activeContracts = contracts.filter(c=>c.status==='継続中');

  // Service breakdown
  const serviceBreakdown = useMemo(() => {
    const map = {};
    activeContracts.forEach(c => {
      if (!map[c.serviceName]) map[c.serviceName] = {count:0, monthlyTotal:0, annualTotal:0};
      map[c.serviceName].count++;
      map[c.serviceName].monthlyTotal += Number(c.monthlyFee)||0;
      map[c.serviceName].annualTotal += Number(c.annualFee)||0;
    });
    return Object.entries(map).sort((a,b)=>b[1].monthlyTotal-a[1].monthlyTotal);
  }, [activeContracts]);

  // Industry breakdown
  const industryBreakdown = useMemo(() => {
    const map = {};
    activeClients.forEach(c => {
      const ind = c.industry || 'その他';
      if (!map[ind]) map[ind] = 0;
      map[ind]++;
    });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  }, [activeClients]);

  // Top clients by revenue
  const topClients = useMemo(() => {
    return activeClients.map(c => {
      const cls = activeContracts.filter(ct=>ct.clientId===c.id);
      const monthly = cls.reduce((s,ct)=>s+(Number(ct.monthlyFee)||0),0);
      const annual = cls.reduce((s,ct)=>s+(Number(ct.annualFee)||0),0);
      return { ...c, monthlyRevenue:monthly, annualRevenue:annual, totalAnnual:monthly*12+annual };
    }).sort((a,b)=>b.totalAnnual-a.totalAnnual).slice(0,10);
  }, [activeClients, activeContracts]);

  const totalMonthly = activeContracts.reduce((s,c)=>s+(Number(c.monthlyFee)||0),0);
  const totalAnnual = activeContracts.reduce((s,c)=>s+(Number(c.annualFee)||0),0);

  return (
    <div>
      <div className="stats-grid" style={{gridTemplateColumns:'repeat(3,1fr)',marginBottom:24}}>
        <div className="stat-card">
          <div className="stat-label">年間売上見込合計（税抜）</div>
          <div className="stat-value" style={{fontSize:24,color:'var(--secondary)'}}>{formatCurrency(totalMonthly*12+totalAnnual)}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">月額報酬合計（税抜）</div>
          <div className="stat-value" style={{fontSize:24}}>{formatCurrency(totalMonthly)}</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">年額報酬合計（税抜）</div>
          <div className="stat-value" style={{fontSize:24}}>{formatCurrency(totalAnnual)}</div>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:20}}>
        <div className="card">
          <div className="card-header"><h2>サービス別売上内訳</h2></div>
          <div className="card-body" style={{padding:0}}>
            <table>
              <thead><tr><th>サービス名</th><th>契約数</th><th style={{textAlign:'right'}}>月額合計</th><th style={{textAlign:'right'}}>年額合計</th></tr></thead>
              <tbody>
                {serviceBreakdown.map(([name,d])=>(
                  <tr key={name} style={{cursor:'default'}}>
                    <td style={{fontWeight:600}}>{name}</td>
                    <td>{d.count}件</td>
                    <td style={{textAlign:'right'}}>{formatCurrency(d.monthlyTotal)}</td>
                    <td style={{textAlign:'right'}}>{formatCurrency(d.annualTotal)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        <div className="card">
          <div className="card-header"><h2>業種別顧客数</h2></div>
          <div className="card-body" style={{padding:0}}>
            <table>
              <thead><tr><th>業種</th><th>件数</th><th>割合</th></tr></thead>
              <tbody>
                {industryBreakdown.map(([name,count])=>(
                  <tr key={name} style={{cursor:'default'}}>
                    <td style={{fontWeight:600}}>{name}</td>
                    <td>{count}件</td>
                    <td>{(count/activeClients.length*100).toFixed(1)}%</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-header"><h2>顧客別年間売上ランキング（税抜）</h2></div>
        <div className="card-body" style={{padding:0}}>
          <table>
            <thead><tr><th>#</th><th>会社名</th><th>業種</th><th style={{textAlign:'right'}}>月額</th><th style={{textAlign:'right'}}>年額報酬</th><th style={{textAlign:'right'}}>年間売上見込</th></tr></thead>
            <tbody>
              {topClients.map((c,i)=>(
                <tr key={c.id} style={{cursor:'default'}}>
                  <td style={{fontWeight:700,color:'var(--primary)'}}>{i+1}</td>
                  <td style={{fontWeight:600}}>{c.companyName}</td>
                  <td>{c.industry||'—'}</td>
                  <td style={{textAlign:'right'}}>{formatCurrency(c.monthlyRevenue)}</td>
                  <td style={{textAlign:'right'}}>{formatCurrency(c.annualRevenue)}</td>
                  <td style={{textAlign:'right',fontWeight:700}}>{formatCurrency(c.totalAnnual)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ===== Modal Router =====
function ModalRouter({modal,setModal,addClient,updateClient,addContract,updateContract,addHistory}) {
  const close = () => setModal(null);
  if (modal.type === 'addClient') return <ClientFormModal title="新規顧客登録" onSave={(d)=>{addClient(d);close();}} onClose={close} />;
  if (modal.type === 'editClient') return <ClientFormModal title="顧客情報編集" data={modal.data} onSave={(d)=>{updateClient(d);close();}} onClose={close} />;
  if (modal.type === 'addContract') return <ContractFormModal title="契約追加" clientId={modal.clientId} onSave={(d)=>{addContract(d);close();}} onClose={close} />;
  if (modal.type === 'editContract') return <ContractFormModal title="契約編集" data={modal.data} onSave={(d)=>{updateContract(d);close();}} onClose={close} />;
  if (modal.type === 'addHistory') return <HistoryFormModal title="対応履歴追加" clientId={modal.clientId} onSave={(d)=>{addHistory(d);close();}} onClose={close} />;
  return null;
}
