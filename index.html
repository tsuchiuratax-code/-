<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title">日本語サポート デモ</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1 data-i18n="appTitle">日本語サポート デモ</h1>
      <div class="lang-switcher">
        <button id="lang-ja" class="lang-btn active" onclick="setLanguage('ja')">日本語</button>
        <button id="lang-en" class="lang-btn" onclick="setLanguage('en')">English</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h2 data-i18n="heroTitle">ようこそ</h2>
      <p data-i18n="heroDescription">このアプリは日本語と英語の両方に対応しています。言語切り替えボタンで表示言語を変更できます。</p>
    </section>

    <section class="features">
      <h2 data-i18n="featuresTitle">主な機能</h2>
      <div class="feature-grid">
        <div class="feature-card">
          <div class="feature-icon">🌐</div>
          <h3 data-i18n="feature1Title">多言語対応</h3>
          <p data-i18n="feature1Desc">日本語・英語の切り替えをリアルタイムで行えます。</p>
        </div>
        <div class="feature-card">
          <div class="feature-icon">📝</div>
          <h3 data-i18n="feature2Title">日本語入力</h3>
          <p data-i18n="feature2Desc">ひらがな・カタカナ・漢字すべての入力に対応しています。</p>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🔤</div>
          <h3 data-i18n="feature3Title">フォント最適化</h3>
          <p data-i18n="feature3Desc">日本語フォントを最適化し、読みやすい表示を実現します。</p>
        </div>
      </div>
    </section>

    <section class="demo">
      <h2 data-i18n="demoTitle">テキスト入力デモ</h2>
      <div class="input-area">
        <label for="text-input" data-i18n="inputLabel">日本語でテキストを入力してください：</label>
        <textarea id="text-input" data-i18n-placeholder="inputPlaceholder" placeholder="ここに入力..."></textarea>
        <div class="char-count">
          <span data-i18n="charCount">文字数：</span>
          <span id="count">0</span>
        </div>
        <button id="submit-btn" data-i18n="submitBtn" onclick="handleSubmit()">送信</button>
      </div>
      <div id="output" class="output" style="display:none;">
        <h3 data-i18n="outputTitle">入力内容</h3>
        <p id="output-text"></p>
      </div>
    </section>
  </main>

  <footer>
    <p data-i18n="footer">© 2026 日本語サポート デモ</p>
  </footer>

  <script src="locales/ja.js"></script>
  <script src="locales/en.js"></script>
  <script src="src/i18n.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
